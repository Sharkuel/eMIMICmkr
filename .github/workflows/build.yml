name: Build

# Ready-to-run eMIMICmkr for Linux, Windows and macOS on every push. A tag such as v0.2.0
# also publishes them as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-14
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype-dev libfontconfig1-dev libxcomposite-dev ninja-build rpm

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          elif [ "$RUNNER_OS" = "Linux" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          else
            cmake -B build
          fi

      - name: Build
        shell: bash
        run: |
          # Compiler errors also go up as annotations, readable without the full log.
          set -o pipefail
          cmake --build build --config Release --target eMIMICmkr eMIMICmkr_tests --parallel 4 2>&1 | tee build.log || {
            grep -E "error|Error" build.log | grep -v "warning" | head -20 | sed 's/^/::error::/'
            exit 1
          }

      - name: Test
        shell: bash
        run: |
          tests=$(find build -type f \( -name eMIMICmkr_tests -o -name eMIMICmkr_tests.exe \) -perm -u+x | head -1)
          [ -z "$tests" ] && tests=$(find build -type f -name eMIMICmkr_tests.exe | head -1)
          set -o pipefail
          "$tests" "$RUNNER_TEMP/emimicmkr-test" 2>&1 | tee test.log || {
            grep -E "WRONG|FAIL|error" test.log | head -20 | sed 's/^/::error::/'
            exit 1
          }

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          app=build/eMIMICmkr_artefacts/Release
          version=$(sed -n 's/^project(eMIMICmkr VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          case "$RUNNER_OS" in
            Linux)   cp assets/logo.png "$app/eMIMICmkr.png"
                     cp packaging/linux/eMIMICmkr.desktop "$app/"
                     tar -C "$app" -czf dist/eMIMICmkr-Linux-x86_64.tar.gz eMIMICmkr eMIMICmkr.png eMIMICmkr.desktop
                     # .deb and .rpm
                     (cd build && cpack -G "DEB;RPM" -B "$PWD/../dist/cpack") && mv dist/cpack/*.deb dist/cpack/*.rpm dist/
                     rm -rf dist/cpack
                     # AppImage
                     DESTDIR="$PWD/AppDir" cmake --install build --component eMIMICmkr --prefix /usr
                     curl -fsSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
                     chmod +x linuxdeploy
                     APPIMAGE_EXTRACT_AND_RUN=1 LDAI_OUTPUT=dist/eMIMICmkr-x86_64.AppImage ./linuxdeploy --appdir AppDir \
                       -d AppDir/usr/share/applications/eMIMICmkr.desktop \
                       -i AppDir/usr/share/icons/hicolor/512x512/apps/eMIMICmkr.png --output appimage ;;
            Windows) # A setup program (Start menu entry, uninstaller), and the bare .exe for a portable copy.
                     # Inno Setup comes with GitHub's Windows images; install it if an image lacks it.
                     iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
                     [ -x "$iscc" ] || { choco install innosetup -y --no-progress && iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"; }
                     "$iscc" "//DAppVersion=$version" "//DAppExe=$(cygpath -w "$PWD/$app/eMIMICmkr.exe")" \
                       "//O$(cygpath -w "$PWD/dist")" packaging/windows/eMIMICmkr.iss
                     7z a dist/eMIMICmkr-Windows-x64.zip "./$app/eMIMICmkr.exe" ;;
            macOS)   # A disk image to drag into Applications, and the zipped app.
                     mkdir dmg && cp -R "$app/eMIMICmkr.app" dmg/ && ln -s /Applications dmg/Applications
                     hdiutil create -volname eMIMICmkr -srcfolder dmg -ov -format UDZO dist/eMIMICmkr-macOS.dmg
                     ditto -c -k --keepParent "$app/eMIMICmkr.app" dist/eMIMICmkr-macOS.zip ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: eMIMICmkr-${{ matrix.name }}
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
