name: Build

# Ready-to-run eMIMICmkr for Linux, Windows and macOS on every push. A tag such as v0.2.0
# also publishes them as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-14
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype-dev libfontconfig1-dev libxcomposite-dev ninja-build

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          elif [ "$RUNNER_OS" = "Linux" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          else
            cmake -B build
          fi

      - name: Build
        shell: bash
        run: |
          # Compiler errors also go up as annotations, readable without the full log.
          set -o pipefail
          cmake --build build --config Release --target eMIMICmkr eMIMICmkr_tests --parallel 4 2>&1 | tee build.log || {
            grep -E "error|Error" build.log | grep -v "warning" | head -20 | sed 's/^/::error::/'
            exit 1
          }

      - name: Test
        shell: bash
        run: |
          tests=$(find build -type f \( -name eMIMICmkr_tests -o -name eMIMICmkr_tests.exe \) -perm -u+x | head -1)
          [ -z "$tests" ] && tests=$(find build -type f -name eMIMICmkr_tests.exe | head -1)
          set -o pipefail
          "$tests" "$RUNNER_TEMP/emimicmkr-test" 2>&1 | tee test.log || {
            grep -E "WRONG|FAIL|error" test.log | head -20 | sed 's/^/::error::/'
            exit 1
          }

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          app=build/eMIMICmkr_artefacts/Release
          case "$RUNNER_OS" in
            Linux)   tar -C "$app" -czf dist/eMIMICmkr-Linux-x86_64.tar.gz eMIMICmkr ;;
            Windows) 7z a dist/eMIMICmkr-Windows-x64.zip "./$app/eMIMICmkr.exe" ;;
            macOS)   ditto -c -k --keepParent "$app/eMIMICmkr.app" dist/eMIMICmkr-macOS.zip ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: eMIMICmkr-${{ matrix.name }}
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
